{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.meta.title if page.meta and page.meta.title else config.site_name }}">
  <meta property="og:description" content="{{ page.meta.description if page.meta and page.meta.description else config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url if page.canonical_url else config.site_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/images/drift-doctrine-social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.meta.title if page.meta and page.meta.title else config.site_name }}">
  <meta name="twitter:description" content="{{ page.meta.description if page.meta and page.meta.description else config.site_description }}">
  <meta name="twitter:image" content="{{ config.site_url }}assets/images/drift-doctrine-social.png">
{% endblock %}
