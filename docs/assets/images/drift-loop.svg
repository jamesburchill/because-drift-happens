<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
  <title id="title">Drift and coherence control loop</title>
  <desc id="desc">A conceptual loop connecting intent, context, execution, outcome, feedback, and intervention under a control plane.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="820" height="520" rx="34" fill="url(#surface)" stroke="#d7e5de"/>
  <rect x="72" y="70" width="716" height="96" rx="24" fill="#111111" filter="url(#softShadow)"/>
  <text x="104" y="112" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Control plane</text>
  <text x="104" y="142" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="15">observe / constrain / intervene / audit</text>
  <path d="M566 118h118" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round"/>
  <path d="M684 106l18 12-18 12" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff" stroke="#d2ded8" stroke-width="2" filter="url(#softShadow)">
    <rect x="116" y="238" width="150" height="74" rx="18"/>
    <rect x="356" y="214" width="150" height="74" rx="18"/>
    <rect x="596" y="238" width="150" height="74" rx="18"/>
    <rect x="356" y="388" width="150" height="74" rx="18"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111111">
    <text x="162" y="283">Intent</text>
    <text x="394" y="259">Context</text>
    <text x="627" y="283">Execution</text>
    <text x="394" y="433">Outcome</text>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 275c45-35 71-38 90-24"/>
    <path d="M506 251c42-13 66-6 90 24"/>
    <path d="M674 312c-7 67-52 104-168 113"/>
    <path d="M356 425c-113-11-166-48-165-113"/>
  </g>

  <g fill="#111111">
    <path d="M346 240l21 6-17 14z"/>
    <path d="M589 267l16 15-22 5z"/>
    <path d="M518 419l-18 12 3-22z"/>
    <path d="M196 321l-9-20 22 3z"/>
  </g>

  <rect x="116" y="352" width="152" height="44" rx="22" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="146" y="380" fill="#7c2d12" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">drift signal</text>

  <rect x="584" y="352" width="162" height="44" rx="22" fill="#dcfce7" stroke="#22c55e"/>
  <text x="616" y="380" fill="#14532d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">intervention</text>

  <path d="M268 374h75" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
  <path d="M518 374h66" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
</svg>
