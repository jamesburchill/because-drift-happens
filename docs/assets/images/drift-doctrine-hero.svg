<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
  <title id="title">The Drift Doctrine</title>
  <desc id="desc">A concise visual summary of the Drift Doctrine, showing drift and governance as two complementary halves.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071a37"/>
      <stop offset="1" stop-color="#0f2f5f"/>
    </linearGradient>
    <linearGradient id="drift" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="governance" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="820" height="520" rx="34" fill="url(#surface)" stroke="#d7e5de"/>

  <text x="70" y="90" fill="#071a37" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="800" letter-spacing="2">THE DRIFT DOCTRINE</text>
  <text x="70" y="126" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Small deviations.</text>
  <text x="236" y="126" fill="#f97316" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Amplified.</text>
  <text x="346" y="126" fill="#b91c1c" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Compounded.</text>

  <g filter="url(#softShadow)">
    <rect x="72" y="170" width="310" height="246" rx="24" fill="#ffffff" stroke="#dce7e1"/>
    <rect x="478" y="170" width="310" height="246" rx="24" fill="#ffffff" stroke="#dce7e1"/>
  </g>

  <rect x="72" y="170" width="310" height="58" rx="24" fill="url(#drift)"/>
  <path d="M72 204h310v24H72z" fill="url(#drift)"/>
  <rect x="478" y="170" width="310" height="58" rx="24" fill="url(#governance)"/>
  <path d="M478 204h310v24H478z" fill="url(#governance)"/>

  <text x="104" y="207" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">DRIFT</text>
  <text x="510" y="207" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">GOVERNANCE</text>

  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="760" fill="#111111">
    <text x="128" y="270">Drift is the default.</text>
    <text x="128" y="322">Autonomous drift is inevitable.</text>
    <text x="128" y="374">Federated drift compounds.</text>

    <text x="534" y="270">Awareness reveals drift.</text>
    <text x="534" y="322">Alignment reduces drift.</text>
    <text x="534" y="374">Coordination contains drift.</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">
    <circle cx="104" cy="264" r="15" fill="#0f2f5f"/>
    <text x="100" y="269" fill="#ffffff">1</text>
    <circle cx="104" cy="316" r="15" fill="#f97316"/>
    <text x="100" y="321" fill="#ffffff">2</text>
    <circle cx="104" cy="368" r="15" fill="#b91c1c"/>
    <text x="100" y="373" fill="#ffffff">3</text>

    <circle cx="510" cy="264" r="15" fill="#0f2f5f"/>
    <text x="506" y="269" fill="#ffffff">1</text>
    <circle cx="510" cy="316" r="15" fill="#0f766e"/>
    <text x="506" y="321" fill="#ffffff">2</text>
    <circle cx="510" cy="368" r="15" fill="#2563eb"/>
    <text x="506" y="373" fill="#ffffff">3</text>
  </g>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M413 255h34" stroke="#f97316"/>
    <path d="M447 255l-12-8m12 8l-12 8" stroke="#f97316" stroke-linejoin="round"/>
    <path d="M447 335h-34" stroke="#0f766e"/>
    <path d="M413 335l12-8m-12 8l12 8" stroke="#0f766e" stroke-linejoin="round"/>
  </g>

  <circle cx="430" cy="295" r="63" fill="url(#navy)" filter="url(#softShadow)"/>
  <text x="430" y="278" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">GOVERNANCE</text>
  <text x="430" y="301" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">EXISTS TO</text>
  <text x="430" y="324" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">REDUCE DRIFT</text>

  <rect x="72" y="452" width="716" height="54" rx="18" fill="#111111"/>
  <text x="430" y="485" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Drift is inevitable. Governance is essential.</text>
</svg>
