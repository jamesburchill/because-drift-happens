<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="title desc">
  <title id="title">The Drift Doctrine</title>
  <desc id="desc">A concise visual summary of the Drift Doctrine, showing drift and governance as two complementary halves.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <linearGradient id="drift" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="governance" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="820" height="520" rx="34" fill="url(#surface)" stroke="#d7e5de"/>

  <text x="70" y="86" fill="#071a37" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="1.5">THE DRIFT DOCTRINE</text>
  <text x="70" y="124" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Small deviations.</text>
  <text x="240" y="124" fill="#f97316" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Amplified.</text>
  <text x="352" y="124" fill="#b91c1c" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Compounded.</text>

  <g filter="url(#softShadow)">
    <rect x="70" y="170" width="330" height="248" rx="24" fill="#ffffff" stroke="#dce7e1"/>
    <rect x="460" y="170" width="330" height="248" rx="24" fill="#ffffff" stroke="#dce7e1"/>
  </g>

  <rect x="70" y="170" width="330" height="60" rx="24" fill="url(#drift)"/>
  <path d="M70 206h330v24H70z" fill="url(#drift)"/>
  <rect x="460" y="170" width="330" height="60" rx="24" fill="url(#governance)"/>
  <path d="M460 206h330v24H460z" fill="url(#governance)"/>

  <text x="104" y="209" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">DRIFT</text>
  <text x="494" y="209" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">GOVERNANCE</text>

  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="760" fill="#111111">
    <text x="128" y="273">Drift is the default.</text>
    <text x="128" y="325">Autonomous drift is inevitable.</text>
    <text x="128" y="377">Federated drift compounds.</text>

    <text x="518" y="273">Awareness reveals drift.</text>
    <text x="518" y="325">Alignment reduces drift.</text>
    <text x="518" y="377">Coordination contains drift.</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">
    <circle cx="104" cy="267" r="15" fill="#0f2f5f"/>
    <text x="100" y="272" fill="#ffffff">1</text>
    <circle cx="104" cy="319" r="15" fill="#f97316"/>
    <text x="100" y="324" fill="#ffffff">2</text>
    <circle cx="104" cy="371" r="15" fill="#b91c1c"/>
    <text x="100" y="376" fill="#ffffff">3</text>

    <circle cx="494" cy="267" r="15" fill="#0f2f5f"/>
    <text x="490" y="272" fill="#ffffff">1</text>
    <circle cx="494" cy="319" r="15" fill="#0f766e"/>
    <text x="490" y="324" fill="#ffffff">2</text>
    <circle cx="494" cy="371" r="15" fill="#2563eb"/>
    <text x="490" y="376" fill="#ffffff">3</text>
  </g>

  <g fill="none" stroke="#dce7e1" stroke-width="1.5">
    <path d="M104 293h250"/>
    <path d="M104 345h250"/>
    <path d="M494 293h250"/>
    <path d="M494 345h250"/>
  </g>

  <path d="M405 294h50" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <path d="M455 294l-14-9m14 9l-14 9" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="452" width="720" height="56" rx="18" fill="#111111"/>
  <text x="430" y="482" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Governance exists to reduce drift.</text>
  <text x="430" y="502" text-anchor="middle" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Awareness. Alignment. Coordination.</text>
</svg>
