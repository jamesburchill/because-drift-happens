site_name: Because Drift Happens™
site_url: https://becausedrifthappens.com/
site_author: James Burchill
site_description: A doctrine for recognizing and responding when businesses, processes, assumptions, and technology drift from their original intent.
repo_name: jamesburchill/because-drift-happens
repo_url: https://github.com/jamesburchill/because-drift-happens
edit_uri: edit/main/docs/
copyright: Copyright &copy; James Burchill
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/mark.svg
  favicon: assets/images/mark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: black
      accent: teal
  font:
    text: Inter
    code: IBM Plex Mono

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start Here:
      - Doctrine: doctrine.md
      - Manifesto: manifesto.md
      - Principles: principles.md
      - Reading Map: reading-map.md
      - Glossary: glossary.md
  - Core Concepts:
      - Drift: drift.md
      - Coherence: coherence.md
      - Governance: governance.md
      - Federation: federation.md
      - Control Planes: control-planes.md
      - Intervention: intervention.md
      - Observability: observability.md
  - Patterns:
      - Failure Patterns: failure-patterns.md
      - Architecture Patterns: architecture-patterns.md
  - Examples:
      - Overview: examples/index.md
      - Business Commitment Example: examples/business-commitment-example.md
      - Drift Signal Example: examples/drift-signal-example.md
      - Governance Checkpoint Example: examples/governance-checkpoint-example.md
      - Runtime Intervention Example: examples/runtime-intervention-example.md
  - Diagrams:
      - Overview: diagrams/index.md
  - RFCs:
      - Overview: rfcs/index.md
      - "0001: Framework Scope": rfcs/0001-framework-scope.md

not_in_nav: |
  /diagrams/placeholders.md

extra:
  author_url: https://jamesburchill.com/
  maturity_labels:
    stable:
      label: Stable doctrine
      detail: The six-line core is the framework’s reference wording; its explanations and visual interpretations can evolve.
    working:
      label: Working interpretation
      detail: Open to refinement and evidence; not a validated production design.
    illustrative:
      label: Illustrative example
      detail: A hypothetical scenario, not a client case study or production design.
    planned:
      label: Planned work
      detail: A backlog item, not a completed model.
    accepted:
      label: Accepted scope
      detail: A recorded framework decision, not a claim of implementation.
    guide:
      label: Reading guide
      detail: Navigation and context for the evolving body of work.
